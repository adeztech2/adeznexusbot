<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADEZ NEXUS — Status</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --online:      #25D366;
      --online-dim:  #1da851;
      --offline:     #ef4444;
      --connecting:  #f59e0b;
      --bg:          #0a0f1e;
      --card:        rgba(255,255,255,0.06);
      --border:      rgba(255,255,255,0.10);
      --text:        #e2e8f0;
      --muted:       #94a3b8;
      --radius:      16px;
      --accent:      #25D366;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    /* ── Animated mesh background ─────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(37,211,102,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 85%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 55% 50%, rgba(16,185,129,0.06) 0%, transparent 60%);
      animation: meshShift 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes meshShift {
      0%   { opacity: 1; }
      50%  { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* ── Card ─────────────────────────────────────────────────────── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px 32px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform 0.3s ease;
    }

    @media (max-width: 520px) {
      .card { padding: 32px 20px 24px; border-radius: 20px; }
    }

    /* ── Header ───────────────────────────────────────────────────── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 32px;
    }

    .logo {
      font-size: 3.2rem;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(37,211,102,0.35));
      animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    .brand {
      margin-top: 10px;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #25D366 0%, #a3e6b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .version {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Status orb ───────────────────────────────────────────────── */
    .orb-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .orb {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      position: relative;
      transition: background 0.6s ease, box-shadow 0.6s ease;
    }

    .orb.online {
      background: radial-gradient(circle at 35% 35%, #5fffaa, #25D366 60%, #1da851);
      box-shadow: 0 0 0 0 rgba(37,211,102,0.5);
      animation: orbPulse 2.4s ease-in-out infinite;
    }

    .orb.offline {
      background: radial-gradient(circle at 35% 35%, #ff8080, #ef4444 60%, #b91c1c);
      box-shadow: 0 0 24px rgba(239,68,68,0.35);
    }

    .orb.connecting {
      background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b 60%, #d97706);
      box-shadow: 0 0 24px rgba(245,158,11,0.4);
      animation: orbSpin 1.6s linear infinite;
    }

    @keyframes orbPulse {
      0%   { box-shadow: 0 0 0 0   rgba(37,211,102,0.55); }
      60%  { box-shadow: 0 0 0 18px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0   rgba(37,211,102,0); }
    }

    @keyframes orbSpin {
      to { transform: rotate(360deg); }
    }

    .status-label {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.5s ease;
    }

    .status-label.online     { color: var(--online); }
    .status-label.offline    { color: var(--offline); }
    .status-label.connecting { color: var(--connecting); }

    /* ── Info grid ────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (max-width: 380px) {
      .grid { grid-template-columns: 1fr; }
    }

    .cell {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: background 0.2s ease;
    }

    .cell:hover { background: rgba(255,255,255,0.07); }

    .cell-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .cell-value {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-all;
    }

    .cell-value.highlight { color: var(--online); }

    /* ── Divider ──────────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0 20px;
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotBlink 1.8s ease-in-out infinite;
    }

    @keyframes dotBlink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ── Fade transition on data update ──────────────────────────── */
    .fade-update {
      animation: fadeVal 0.4s ease;
    }

    @keyframes fadeVal {
      0%   { opacity: 0.3; transform: translateY(3px); }
      100% { opacity: 1;   transform: translateY(0); }
    }

    /* ── Skeleton shimmer while loading ──────────────────────────── */
    .shimmer {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;
      height: 1em;
      width: 70%;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Scrollbar ────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 99px; }
  </style>
</head>
<body>

  <div class="card">

    <div class="header">
      <div class="logo">🐼</div>
      <div class="brand">ADEZ NEXUS</div>
      <div class="version">v1.0.0 &nbsp;•&nbsp; WhatsApp Bot</div>
    </div>

    <div class="orb-wrap">
      <div class="orb" id="orb"><span id="orbEmoji">⏳</span></div>
      <div class="status-label" id="statusLabel">Loading…</div>
    </div>

    <div class="grid">
      <div class="cell">
        <div class="cell-label">📱 Phone</div>
        <div class="cell-value" id="phone"><div class="shimmer"></div></div>
      </div>
      <div class="cell">
        <div class="cell-label">⏱ Uptime</div>
        <div class="cell-value highlight" id="uptime"><div class="shimmer"></div></div>
      </div>
      <div class="cell" style="grid-column: 1 / -1">
        <div class="cell-label">🕐 Last Active</div>
        <div class="cell-value" id="lastSeen"><div class="shimmer"></div></div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="footer">
      <div class="dot"></div>
      Auto-refreshes every 5 seconds
    </div>

  </div>

  <script>
    const EMOJI   = { online: '✅', offline: '❌', connecting: '🔄' };
    const LABEL   = { online: 'Online', offline: 'Offline', connecting: 'Connecting…' };

    let lastStatus = null;

    function setVal(id, html, animate = true) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = html;
      if (animate) {
        el.classList.remove('fade-update');
        void el.offsetWidth;
        el.classList.add('fade-update');
      }
    }

    function fmtDate(iso) {
      if (!iso) return 'N/A';
      try {
        return new Date(iso).toLocaleString(undefined, {
          month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
      } catch { return iso; }
    }

    async function refresh() {
      try {
        const res  = await fetch('/status');
        const data = await res.json();
        const st   = data.status || 'offline';
        const changed = st !== lastStatus;
        lastStatus = st;

        const orb   = document.getElementById('orb');
        const label = document.getElementById('statusLabel');

        orb.className   = 'orb ' + st;
        label.className = 'status-label ' + st;

        if (changed) {
          document.getElementById('orbEmoji').textContent = EMOJI[st] ?? '❓';
          label.textContent = LABEL[st] ?? st;
        }

        setVal('phone',   data.phoneNumber || 'N/A', changed);
        setVal('uptime',  data.uptime      || 'N/A', changed);
        setVal('lastSeen', fmtDate(data.lastSeen), changed);

      } catch {
        const orb   = document.getElementById('orb');
        const label = document.getElementById('statusLabel');
        orb.className   = 'orb offline';
        label.className = 'status-label offline';
        label.textContent = 'Unreachable';
        document.getElementById('orbEmoji').textContent = '⚠️';
      }
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
