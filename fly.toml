# fly launch --no-deploy   (it will offer to keep this file; change the app name)
# fly volumes create nexus_data --size 1 --region fra
# fly secrets set SESSION_ID=ADEZ~... OWNER_NUMBER=254... DATABASE_URL=...
# fly deploy
app = "adez-nexus"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # a WhatsApp bot must never be stopped
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[mounts]
  source = "nexus_data"
  destination = "/app/lib/session"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
