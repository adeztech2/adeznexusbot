services:
  - type: web
    name: nexus
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SESSION_ID
        sync: false
      - key: OWNER_NUMBER
        sync: false
      - key: DATABASE_URL
        sync: false   # paste your Supabase *Session pooler* string in the Render dashboard
      - key: API_KEYS
        sync: false
      - key: GIFTED_TECH_API
        value: https://api.gifted.co.ke
      - key: GIFTED_API_KEY
        value: gifted
      - key: KEEP_ALIVE_MINUTES
        value: "4"
      - key: MODE
        value: public
      - key: PREFIX
        value: "."
